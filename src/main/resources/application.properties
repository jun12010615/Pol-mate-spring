spring.application.name=pol-mate-spring

# ── 로컬 시크릿 오버라이드 ───────────────────────────────────────────
# application-local.properties 파일을 src/main/resources/ 에 직접 생성하세요.
# 이 파일은 .gitignore에 등록되어 있어 git에 올라가지 않습니다.
# 아래 ${변수:기본값} 형식의 항목들을 원하는 값으로 덮어쓸 수 있습니다.
#
# [application-local.properties 작성 예시]
#
#   spring.datasource.url=jdbc:mysql://실제DB주소:3306/pol-mate?characterEncoding=UTF-8&serverTimezone=Asia%2FSeoul
#   spring.datasource.username=DB계정
#   spring.datasource.password=DB비밀번호
#
#   spring.mail.username=발신용이메일@gmail.com
#   spring.mail.password=Gmail앱비밀번호
#
#   clova.speech.secret-key=CLOVA_시크릿키
#   polmate.serv.base-url=http://localhost:5001
#   ollama.url=http://localhost:11434/api/generate
#
# [주의사항]
#   - 파일이 없어도 앱은 실행됩니다 (optional). 단, DB 주소가 기본값(localhost)이므로
#     외부 DB를 쓴다면 반드시 이 파일에 올바른 주소를 적어야 합니다.
#   - 팀원에게 공유할 때는 이 파일을 직접 전달하세요 (git 경유 불가).
spring.config.import=optional:classpath:application-local.properties

# ── DB ──────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pol-mate?characterEncoding=UTF-8&serverTimezone=Asia%2FSeoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── SQL 초기화 (emotion_analyses 테이블 자동 생성) ────────────────
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-emotion.sql

# ── Thymeleaf ────────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── 인코딩 ───────────────────────────────────────────────────────
spring.web.resources.add-mappings=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ── 파일 업로드 ──────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# ── 메일 (FindAccount SMTP) ──────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# ── 외부 서비스 ──────────────────────────────────────────────────
polmate.serv.base-url=${POLMATE_SERV_URL:http://localhost:5001}
clova.speech.invoke-url=https://clovaspeech-gw.ncloud.com/recog/v1/stt
clova.speech.secret-key=${CLOVA_SECRET_KEY:}
ollama.url=${OLLAMA_URL:http://localhost:11434/api/generate}
ollama.model=${OLLAMA_MODEL:exaone3.5:2.4b}
law.api.oc=PolmateAPI

server.port=8080

# ── 신뢰 프록시 IP (X-Forwarded-For 헤더를 수락할 IP, 쉼표 구분) ──────────────
# 리버스 프록시(nginx 등) 없이 직접 서비스하는 경우 비워두면 RemoteAddr만 사용
trusted.proxy.ips=${TRUSTED_PROXY_IPS:}
