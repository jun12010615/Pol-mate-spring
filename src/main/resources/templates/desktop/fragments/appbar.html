<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><body>
<th:block th:fragment="appbar(breadcrumbStr)">
<style>
.pm-appbar {
    height: 64px;
    background: #fff;
    border-bottom: 1px solid #e2e5ee;
    display: flex;
    align-items: center;
    padding: 0 28px;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 50;
    flex-shrink: 0;
}
.pm-appbar-burger {
    display: none;
    width: 36px; height: 36px;
    border: none; background: transparent; cursor: pointer;
    border-radius: 8px;
    align-items: center; justify-content: center;
    color: #6b7280;
    transition: background 0.13s;
}
.pm-appbar-burger:hover { background: #f4f6fb; }
@media (max-width: 900px) { .pm-appbar-burger { display: flex; } }
.pm-breadcrumb { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.pm-bc-item { font-size: 12px; color: #9ca3af; white-space: nowrap; }
.pm-bc-item.current { font-size: 14px; font-weight: 500; color: #1a1a2e; }
.pm-bc-sep { font-size: 11px; color: #e2e5ee; }
.pm-appbar-search {
    display: flex; align-items: center; gap: 8px;
    background: #f4f6fb; border: 1.5px solid #e2e5ee;
    border-radius: 12px; padding: 8px 14px; width: 240px;
    transition: border-color 0.15s, box-shadow 0.15s, width 0.2s;
    position: relative;
}
.pm-appbar-search:focus-within {
    border-color: #0d1a33;
    box-shadow: 0 0 0 3px rgba(13,26,51,0.07);
    background: #fff;
    width: 320px;
}
.pm-appbar-search svg { color: #9ca3af; flex-shrink: 0; }
.pm-appbar-search input {
    border: none; background: transparent; outline: none;
    font-size: 13px; font-family: 'Noto Sans KR', sans-serif;
    color: #1a1a2e; width: 100%;
}
.pm-appbar-search input::placeholder { color: #9ca3af; }
.pm-search-drop {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    width: 420px;
    background: #fff;
    border: 1px solid #e2e5ee;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.13);
    z-index: 9999;
    max-height: 480px;
    overflow-y: auto;
}
.pm-sd-section { border-bottom: 1px solid #f0f2f8; }
.pm-sd-section:last-of-type { border-bottom: none; }
.pm-sd-head {
    padding: 10px 16px 4px;
    font-size: 10px; font-weight: 600; color: #9ca3af;
    text-transform: uppercase; letter-spacing: 0.7px;
}
.pm-sd-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 8px 16px; cursor: pointer;
    transition: background 0.1s; text-decoration: none; color: inherit;
}
.pm-sd-item:hover { background: #f4f6fb; }
.pm-sd-icon {
    width: 28px; height: 28px; border-radius: 8px; background: #f0f2f8;
    display: flex; align-items: center; justify-content: center;
    color: #6b7280; flex-shrink: 0; margin-top: 1px;
}
.pm-sd-text { flex: 1; min-width: 0; }
.pm-sd-title { font-size: 13px; font-weight: 500; color: #1a1a2e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pm-sd-sub { font-size: 11px; color: #9ca3af; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pm-sd-snippet { font-size: 11px; color: #6b7280; margin-top: 3px; line-height: 1.6; }
.pm-sd-more {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 11px 16px; font-size: 12px; color: #0d1a33; font-weight: 500;
    cursor: pointer; border-top: 1px solid #f0f2f8; transition: background 0.1s;
}
.pm-sd-more:hover { background: #f4f6fb; }
.pm-sd-empty { padding: 28px 16px; text-align: center; color: #9ca3af; font-size: 13px; }
.pm-sd-loading { padding: 20px 16px; text-align: center; color: #9ca3af; font-size: 13px; }
.pm-search-drop mark { background: #fef3c7; color: #92400e; border-radius: 2px; padding: 0 1px; font-style: normal; }
.pm-appbar-actions { display: flex; align-items: center; gap: 4px; }
.pm-appbar-icon-btn {
    width: 36px; height: 36px; border-radius: 10px;
    border: none; background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #6b7280; position: relative;
    text-decoration: none;
    transition: background 0.13s, color 0.13s;
}
.pm-appbar-icon-btn:hover { background: #f4f6fb; color: #1a1a2e; }
.pm-appbar-notif-dot {
    position: absolute; top: 5px; right: 5px;
    width: 7px; height: 7px; border-radius: 50%;
    background: #dc2626; border: 2px solid #fff; display: none;
}
.pm-appbar-notif-dot.on { display: block; }
.pm-appbar-avatar {
    width: 32px; height: 32px; border-radius: 8px;
    background: #0d1a33;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid rgba(240,192,64,0.3);
    text-decoration: none;
    transition: border-color 0.13s; flex-shrink: 0;
}
.pm-appbar-avatar:hover { border-color: #f0c040; }
</style>

<header class="pm-appbar">
    <button class="pm-appbar-burger" onclick="pmToggleSidebar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
    </button>

    <nav class="pm-breadcrumb">
        <th:block th:each="crumb, stat : ${breadcrumbStr.split(',')}">
            <span th:if="${!stat.first}" class="pm-bc-sep">›</span>
            <span class="pm-bc-item"
                  th:classappend="${stat.last} ? ' current'"
                  th:text="${crumb.trim()}"></span>
        </th:block>
    </nav>

    <div class="pm-appbar-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="pmSearchInput" placeholder="사건·피의자·조서·게시글 검색..." oninput="pmGlobalSearch(this.value)" autocomplete="off">
        <div id="pmSearchDrop" class="pm-search-drop"></div>
    </div>

    <div class="pm-appbar-actions">
        <a th:href="@{/desktop/notifications}" class="pm-appbar-icon-btn">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
            </svg>
            <span class="pm-appbar-notif-dot" id="pmAbDot"></span>
        </a>
        <a th:href="@{/desktop/mypage}" class="pm-appbar-avatar">
            <svg width="18" height="18" viewBox="0 0 86 86" fill="none">
                <path d="M43 7 L66 17 L66 41 C66 57 43 71 43 71 C43 71 20 57 20 41 L20 17 Z" fill="#162240"/>
                <path d="M43 7 L66 17 L66 41 C66 57 43 71 43 71 C43 71 20 57 20 41 L20 17 Z" fill="none" stroke="#f0c040" stroke-width="2.5"/>
                <circle cx="43" cy="40" r="6" fill="#4a7cdc" opacity="0.9"/>
                <circle cx="43" cy="40" r="3" fill="#fff"/>
            </svg>
        </a>
    </div>
</header>

<script>
(function() {
    function refreshAbDot() {
        fetch('/notifApi?action=unreadCount', {credentials: 'same-origin'})
            .then(function(r) { return r.json(); })
            .then(function(d) {
                var dot = document.getElementById('pmAbDot');
                if (!dot) return;
                dot.classList.toggle('on', (d.count || 0) > 0);
            }).catch(function() {});
    }
    refreshAbDot();
    setInterval(refreshAbDot, 60000);

    var _abTimer;
    var _abDrop = null;

    function pmEscHtml(s) {
        return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function pmHl(text, q) {
        var safe = pmEscHtml(text);
        if (!q) return safe;
        var escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return safe.replace(new RegExp(escaped, 'gi'), function(m) { return '<mark>' + m + '</mark>'; });
    }
    function pmEnc(s) { return encodeURIComponent(s || ''); }

    function pmRenderDrop(data, q) {
        var drop = document.getElementById('pmSearchDrop');
        if (!drop) return;
        var total = (data.cases||[]).length + (data.transcripts||[]).length + (data.posts||[]).length;
        var html = '';

        if (total === 0) {
            html = '<div class="pm-sd-empty">검색 결과가 없습니다.</div>';
            drop.innerHTML = html; drop.style.display = 'block'; return;
        }

        if ((data.cases||[]).length > 0) {
            html += '<div class="pm-sd-section"><div class="pm-sd-head">사건</div>';
            data.cases.forEach(function(c) {
                html += '<a class="pm-sd-item" href="/desktop/myCase?caseId=' + pmEnc(c.case_id) + '">' +
                    '<div class="pm-sd-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>' +
                    '<div class="pm-sd-text">' +
                        '<div class="pm-sd-title">' + pmHl(c.case_name, q) + '</div>' +
                        '<div class="pm-sd-sub">' + pmHl(c.case_id, q) + ' · 피의자: ' + pmHl(c.suspect, q) + '</div>' +
                    '</div></a>';
            });
            html += '</div>';
        }

        if ((data.transcripts||[]).length > 0) {
            html += '<div class="pm-sd-section"><div class="pm-sd-head">조서</div>';
            data.transcripts.forEach(function(t) {
                html += '<a class="pm-sd-item" href="/desktop/myCase?caseId=' + pmEnc(t.caseId) + '">' +
                    '<div class="pm-sd-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></div>' +
                    '<div class="pm-sd-text">' +
                        '<div class="pm-sd-title">' + pmHl(t.stmtName, q) + ' ' + pmEscHtml(t.stmtType) + ' 조서</div>' +
                        '<div class="pm-sd-sub">' + pmEscHtml(t.caseName) + '</div>' +
                        (t.snippet ? '<div class="pm-sd-snippet">' + pmHl(t.snippet, q) + '</div>' : '') +
                    '</div></a>';
            });
            html += '</div>';
        }

        if ((data.posts||[]).length > 0) {
            html += '<div class="pm-sd-section"><div class="pm-sd-head">게시글</div>';
            data.posts.forEach(function(p) {
                html += '<a class="pm-sd-item" href="/desktop/boardView?postId=' + pmEnc(p.id) + '">' +
                    '<div class="pm-sd-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>' +
                    '<div class="pm-sd-text">' +
                        '<div class="pm-sd-title">' + pmHl(p.title, q) + '</div>' +
                        '<div class="pm-sd-sub">' + pmEscHtml(p.author) + '</div>' +
                        (p.snippet ? '<div class="pm-sd-snippet">' + pmHl(p.snippet, q) + '</div>' : '') +
                    '</div></a>';
            });
            html += '</div>';
        }

        html += '<div class="pm-sd-more" onclick="location.href=\'/desktop/myCase?q=\'+encodeURIComponent(document.getElementById(\'pmSearchInput\').value)">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
            '사건 전체 검색 결과 보기' +
        '</div>';

        drop.innerHTML = html;
        drop.style.display = 'block';
    }

    window.pmGlobalSearch = function(q) {
        clearTimeout(_abTimer);
        var drop = document.getElementById('pmSearchDrop');
        if (!q || q.trim().length < 2) {
            if (drop) drop.style.display = 'none';
            return;
        }
        if (drop) { drop.innerHTML = '<div class="pm-sd-loading">검색 중...</div>'; drop.style.display = 'block'; }
        _abTimer = setTimeout(function() {
            fetch('/searchApi?q=' + encodeURIComponent(q.trim()), {credentials: 'same-origin'})
                .then(function(r) { return r.json(); })
                .then(function(data) { pmRenderDrop(data, q.trim()); })
                .catch(function() { if (drop) drop.style.display = 'none'; });
        }, 280);
    };

    document.addEventListener('click', function(e) {
        var drop = document.getElementById('pmSearchDrop');
        if (!drop) return;
        var searchWrap = drop.closest('.pm-appbar-search');
        if (searchWrap && !searchWrap.contains(e.target)) drop.style.display = 'none';
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            var drop = document.getElementById('pmSearchDrop');
            var inp  = document.getElementById('pmSearchInput');
            if (drop) drop.style.display = 'none';
            if (inp)  inp.blur();
        }
    });
})();
</script>
</th:block>
</body>
</html>
