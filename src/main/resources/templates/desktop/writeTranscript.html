    function toggleRecord() {
        if (!_isRecording) startRecord(); else stopRecord();
    }

    function startRecord() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showToast('마이크 접근 권한이 필요합니다.');
            return;
        }
        navigator.mediaDevices.getUserMedia({audio: true}).then(function(stream) {
            _audioChunks = [];
            _mediaRecorder = new MediaRecorder(stream);
            _mediaRecorder.ondataavailable = function(e) { _audioChunks.push(e.data); };
            _mediaRecorder.onstop = function() {
                var blob = new Blob(_audioChunks, {type: 'audio/webm'});
                sendAudioBlob(blob);
            };
            _mediaRecorder.start();
            _isRecording = true;
            document.getElementById('recBtn').className = 'rec-btn recording';
            document.getElementById('recTitle').textContent = '녹음 중...';
            document.getElementById('recSub').textContent = '버튼을 눌러 녹음을 종료하세요';
            animateWave(true);
            _recSeconds = 0;
            _recTimer = setInterval(function() {
                _recSeconds++;
                var m = String(Math.floor(_recSeconds/60)).padStart(2,'0');
                var s = String(_recSeconds%60).padStart(2,'0');
                document.getElementById('recTimer').textContent = m + ':' + s;
            }, 1000);
        }).catch(function() { showToast('마이크를 활성할 수 없습니다.'); });
    }

    function stopRecord() {
        if (_mediaRecorder) _mediaRecorder.stop();
        _isRecording = false;
        clearInterval(_recTimer);
        document.getElementById('recBtn').className = 'rec-btn idle';
        document.getElementById('recTitle').textContent = '녹음 완료';
        document.getElementById('recSub').textContent = 'STT 변환 중...';
        animateWave(false);
    }

    function animateWave(active) {
        var bars = document.querySelectorAll('.wave-bar');
        if (active) {
            bars.forEach(function(b, i) {
                b.classList.toggle('active', i < 35);
                if (active) b.style.height = (Math.random() * 80 + 20) + '%';
            });
        } else {
            bars.forEach(function(b) { b.classList.remove('active'); b.style.height = '20%'; });
        }
    }

    function uploadAudio(input) {
        if (!input.files || !input.files[0]) return;
        sendAudioBlob(input.files[0]);
    }

    function sendAudioBlob(blob) {
        var fd = new FormData();
        fd.append('audioFile', blob, 'recording.webm');
        document.getElementById('sttProgressCard').style.display = 'flex';
        animateSttBar(0);

        var progress = 0;
        var interval = setInterval(function() {
            progress = Math.min(progress + 5, 85);
            animateSttBar(progress);
        }, 300);

        fetch('/stt', {method: 'POST', body: fd, credentials: 'same-origin'})
            .then(function(r) { return r.json(); })
            .then(function(d) {
                clearInterval(interval);
                animateSttBar(100);
                setTimeout(function() {
                    document.getElementById('sttProgressCard').style.display = 'none';
                }, 800);
                if (d.text) {
                    _sttText = d.text;
                    renderSegments(d.text);
                    document.getElementById('recTitle').textContent = '녹음 완료';
                    document.getElementById('recSub').textContent = '변환 완료 · 아래 세그먼트를 조서에 삽입하세요';
                } else {
                    showToast(d.error || 'STT 변환 실패했습니다.');
                }
            }).catch(function() {
            clearInterval(interval);
            document.getElementById('sttProgressCard').style.display = 'none';
            showToast('STT 요청 중 오류가 발생했습니다.');
        });
    }

    function animateSttBar(pct) {
        document.getElementById('sttFill').style.width = pct + '%';
        document.getElementById('sttPct').textContent = pct + '%';
        if (pct >= 100) document.getElementById('sttLabel').textContent = '변환 완료';
    }

    function renderSegments(text) {
        var sentences = text.match(/[^.!?]+[.!?]*/g) || [text];
        var html = sentences.map(function(s, i) {
            var spk = i % 3 === 0 ? 'investigator' : 'suspect';
            var spkLabel = spk === 'investigator' ? '수사관' : '피의자';
            var min = String(Math.floor(i * 12 / 60)).padStart(2,'0');
            var sec = String((i * 12) % 60).padStart(2,'0');
            return '<div class="segment-card" onclick="appendToEditor(this.dataset.text)" data-text="' + s.trim().replace(/"/g,'&quot;') + '">'
                + '<div class="seg-time">' + min + ':' + sec + '</div>'
                + '<div class="seg-spk ' + spk + '">' + spkLabel + '</div>'
                + '<div class="seg-text">' + s.trim() + '</div>'
                + '</div>';
        }).join('');
        document.getElementById('segmentList').innerHTML = html;
        document.getElementById('segCount').textContent = sentences.length + '개 세그먼트';
    }

    function handleEditorKey(e) {
        // Enter 키: div 블록 생성 대신 줄바꿈 문자 삽입 (높이 팽창 방지)
        if (e.key === 'Enter') {
            e.preventDefault();
            document.execCommand('insertLineBreak');
        }
    }

    function appendToEditor(text) {
        var editor = document.getElementById('editor');
        editor.focus();
        var sel = window.getSelection();
        if (sel.rangeCount) {
            var range = sel.getRangeAt(0);
            range.deleteContents();
            range.insertNode(document.createTextNode(text + ' '));
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
        } else {
            editor.innerText += text + ' ';
        }
        updateCharCount();
    }

    function insertSttText() {
        if (!_sttText) { showToast('STT 변환 결과가 없습니다.'); return; }
        document.getElementById('editor').focus();
        document.execCommand('insertText', false, '\n' + _sttText);
        updateCharCount();
    }

    function applyTemplate() {
        var caseId = document.getElementById('selCase').value;
        var stmtName = document.getElementById('inputStmtName').value || '(성명)';
        var stmtType = document.getElementById('selStmtType').value || '1차 진술';
        var today = new Date().toLocaleDateString('ko-KR', {year:'numeric',month:'2-digit',day:'2-digit'});
        var template = '1. 인적사항\n'
            + '성명: ' + stmtName + '\n'
            + '사건번호: ' + (caseId || '(선택 필요)') + '\n'
            + '진술 일시: ' + today + '\n\n'
            + '2. 진술 내용\n';
        document.getElementById('editor').focus();
        document.execCommand('selectAll');
        document.execCommand('insertText', false, template);
        updateCharCount();
    }

    // 본문 텍스트를 외부로 내보낼 때 호출 (ZWS 등 보이지 않는 마커 제거)
    function sanitizeEditorText(s) {
        if (s == null) return '';
        return String(s).replace(/\u200B/g, '');
    }

    // 형광펜/메모 등 서식이 포함된 HTML을 그대로 가져옴 (저장용)
    function getEditorHtml() {
        var ed = document.getElementById('editor');
        return (ed.innerHTML || '').replace(/\u200B/g, '');
    }

    // 저장된 HTML을 에디터에 다시 주입하고 메모 이벤트를 재연결
    function setEditorHtml(html) {
        var ed = document.getElementById('editor');
        ed.innerHTML = html || '';
        // 메모 이벤트 재연결 + 잠금 텍스트 재설정
        Array.prototype.forEach.call(ed.querySelectorAll('.memo-mark'), function(m) {
            if (typeof window._reattachMemoEvents === 'function') {
                window._reattachMemoEvents(m);
            }
            if (!m.hasAttribute('data-memo-locked-text')) {
                m.setAttribute('data-memo-locked-text', m.textContent || '');
            }
        });
        // 형광펜도 잠금 텍스트 재설정
        Array.prototype.forEach.call(ed.querySelectorAll('.hl-mark'), function(m) {
            if (!m.hasAttribute('data-hl-locked-text')) {
                m.setAttribute('data-hl-locked-text', m.textContent || '');
            }
        });
    }

    function updateCharCount() {
        var text = sanitizeEditorText(document.getElementById('editor').innerText || '');
        var len = text.length;
        document.getElementById('charCountLabel').textContent = len.toLocaleString() + ' / 5,000자';
        document.getElementById('charCountLabel').style.color = len > 5000 ? '#dc2626' : '#9ca3af';
    }

    /* ── 임시저장 다중 드래프트 시스템 ─────────────────────────────
     * localStorage key: 'draft_transcripts_v2' = JSON array
     *   [{ id, title, text, html, caseId, stmtType, stmtName, savedAt }, ...]
     * 기존 'draft_transcript' (단일 텍스트) 는 첫 진입 시 마이그레이션
     * ──────────────────────────────────────────────────────────── */
    var DRAFTS_KEY = 'draft_transcripts_v2';

    function getDrafts() {
        try {
            var raw = localStorage.getItem(DRAFTS_KEY);
            if (!raw) return [];
            var arr = JSON.parse(raw);
            return Array.isArray(arr) ? arr : [];
        } catch (e) { return []; }
    }
    function setDrafts(arr) {
        try { localStorage.setItem(DRAFTS_KEY, JSON.stringify(arr)); } catch (e) {}
    }

    // 기존 단일 draft_transcript 가 있으면 새 구조로 이주
    (function migrateLegacyDraft() {
        var legacy = localStorage.getItem('draft_transcript');
        if (!legacy) return;
        var legacyHtml = localStorage.getItem('draft_transcript_html') || '';
        var drafts = getDrafts();
        // 이미 같은 본문이 있으면 중복 추가하지 않음
        var exists = drafts.some(function(d) { return d.text === legacy; });
        if (!exists) {
            drafts.unshift({
                id: 'draft-' + Date.now(),
                title: makeDraftTitle(legacy),
                text: legacy,
                html: legacyHtml,
                caseId: '',
                stmtType: '',
                stmtName: '',
                savedAt: Date.now()
            });
            setDrafts(drafts);
        }
        localStorage.removeItem('draft_transcript');
        localStorage.removeItem('draft_transcript_html');
        localStorage.removeItem('draft_dismissed');
    })();

    function makeDraftTitle(text) {
        var t = (text || '').replace(/\s+/g, ' ').trim();
        if (!t) return '(빈 조서)';
        return t.length > 28 ? t.substring(0, 28) + '…' : t;
    }

    function formatDraftTime(ts) {
        if (!ts) return '';
        var d = new Date(ts);
        var now = new Date();
        var sameDay = d.toDateString() === now.toDateString();
        var hh = String(d.getHours()).padStart(2, '0');
        var mm = String(d.getMinutes()).padStart(2, '0');
        if (sameDay) return '오늘 ' + hh + ':' + mm;
        var mo = String(d.getMonth() + 1).padStart(2, '0');
        var da = String(d.getDate()).padStart(2, '0');
        return (d.getFullYear() === now.getFullYear() ? '' : d.getFullYear() + '.')
            + mo + '.' + da + ' ' + hh + ':' + mm;
    }

    function saveDraft() {
        var editor = document.getElementById('editor');
        var text = sanitizeEditorText(editor.innerText).trim();
        if (!text) { showToast('조서 내용을 입력해 주세요.'); return; }

        var stmtName = (document.getElementById('inputStmtName') || {}).value || '';
        var stmtType = (document.getElementById('selStmtType')   || {}).value || '';
        var selCase  = document.getElementById('selCase');
        var caseId   = selCase ? selCase.value : '';
        // select 옵션 텍스트 ("2026-0520 · test사건") 그대로 저장 → 제목 표시용
        var caseLabel = '';
        if (selCase && selCase.selectedIndex >= 0) {
            var opt = selCase.options[selCase.selectedIndex];
            if (opt && opt.value) caseLabel = (opt.textContent || '').trim();
        }

        // 제목 조합: 진술인 · 진술종류 (사건번호 · 사건명)
        var baseTitle = stmtName
            ? (stmtName + (stmtType ? ' · ' + stmtType : ''))
            : makeDraftTitle(text);
        var title = baseTitle + (caseLabel ? ' (' + caseLabel + ')' : '');

        var drafts = getDrafts();
        var newDraft = {
            id: 'draft-' + Date.now(),
            title: title,
            text: text,
            html: getEditorHtml(),
            caseId: caseId,
            caseLabel: caseLabel,
            stmtType: stmtType,
            stmtName: stmtName,
            savedAt: Date.now()
        };
        drafts.unshift(newDraft);
        // 최대 20개 까지만 보관
        if (drafts.length > 20) drafts = drafts.slice(0, 20);
        setDrafts(drafts);
        updateDraftBadge();
        showToast('임시 저장되었습니다.');
    }

    function updateDraftBadge() {
        var badge = document.getElementById('draftCountBadge');
        if (!badge) return;
        var n = getDrafts().length;
        if (n > 0) {
            badge.textContent = String(n);
            badge.style.display = 'inline-flex';
        } else {
            badge.style.display = 'none';
        }
    }

    function renderDraftList() {
        var body = document.getElementById('draftPopoverBody');
        var drafts = getDrafts();
        if (drafts.length === 0) {
            body.innerHTML = '<div class="draft-empty">임시 저장된 조서가 없습니다.</div>';
            return;
        }
        body.innerHTML = drafts.map(function(d) {
            var esc = function(s) {
                return (s || '').replace(/[&<>"]/g, function(c){
                    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];
                });
            };
            // 기존(마이그레이션된) 드래프트에는 title에 사건정보가 없을 수 있으니 보완
            var rawTitle = d.title || '(제목 없음)';
            if (d.caseLabel && rawTitle.indexOf('(') === -1) {
                rawTitle = rawTitle + ' (' + d.caseLabel + ')';
            }
            var titleEsc = esc(rawTitle);
            var prevEsc  = esc(d.text || '');

            return '<div class="draft-item" data-id="' + d.id + '">'
                + '<div class="draft-item-content">'
                + '<div class="draft-item-title">' + titleEsc + '</div>'
                + '<div class="draft-item-preview">' + prevEsc + '</div>'
                + '<div class="draft-item-meta">' + formatDraftTime(d.savedAt) + '</div>'
                + '</div>'
                + '<button class="draft-item-delete" data-del="' + d.id + '" title="삭제" aria-label="삭제">'
                + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>'
                + '</button>'
                + '</div>';
        }).join('');

        // 아이템 클릭 → 불러오기
        Array.prototype.forEach.call(body.querySelectorAll('.draft-item'), function(el) {
            el.addEventListener('click', function(e) {
                if (e.target.closest('[data-del]')) return; // 삭제 버튼 클릭은 제외
                loadDraft(el.getAttribute('data-id'));
            });
        });
        // 삭제 버튼
        Array.prototype.forEach.call(body.querySelectorAll('[data-del]'), function(btn) {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                deleteDraft(btn.getAttribute('data-del'));
            });
        });
    }

    function toggleDraftList(e) {
        if (e) e.stopPropagation();
        var po = document.getElementById('draftPopover');
        if (po.classList.contains('open')) {
            closeDraftList();
        } else {
            renderDraftList();
            po.classList.add('open');
        }
    }
    function closeDraftList() {
        document.getElementById('draftPopover').classList.remove('open');
    }

    function loadDraft(id) {
        var drafts = getDrafts();
        var d = drafts.find(function(x) { return x.id === id; });
        if (!d) return;

        var editor = document.getElementById('editor');
        var hasContent = (sanitizeEditorText(editor.innerText) || '').trim().length > 0;
        if (hasContent && !confirm('현재 작성 중인 내용은 사라집니다. 불러올까요?')) return;

        // 메타 복원
        if (d.stmtName) {
            var nameEl = document.getElementById('inputStmtName');
            if (nameEl) { nameEl.value = d.stmtName; fillFormName(d.stmtName); }
        }
        if (d.stmtType) {
            var typeEl = document.getElementById('selStmtType');
            if (typeEl) typeEl.value = d.stmtType;
        }
        if (d.caseId) {
            setDesiredCaseId(d.caseId);
        }
        // 본문 복원 (서식 우선)
        if (d.html) {
            setEditorHtml(d.html);
        } else {
            editor.innerText = d.text || '';
        }
        updateCharCount();
        closeDraftList();
        showToast('임시 저장본을 불러왔습니다.');
    }

    function deleteDraft(id) {
        var drafts = getDrafts().filter(function(d) { return d.id !== id; });
        setDrafts(drafts);
        updateDraftBadge();
        renderDraftList();
        showToast('삭제되었습니다.');
    }

    // 팝오버 바깥 클릭 시 닫기
    document.addEventListener('click', function(e) {
        var po = document.getElementById('draftPopover');
        if (!po || !po.classList.contains('open')) return;
        if (po.contains(e.target)) return;
        if (e.target.closest && e.target.closest('#btnDraftList')) return;
        closeDraftList();
    });
    // Esc 로 닫기
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeDraftList();
    });

    // 초기 배지 갱신
    updateDraftBadge();

    function confirmSave() {
        var caseId = document.getElementById('selCase').value;
        var text = sanitizeEditorText(document.getElementById('editor').innerText).trim();
        if (!caseId) { showToast('사건을 선택해 주세요.'); return; }
        if (!text) { showToast('조서 내용을 입력해 주세요.'); return; }

        var btn = document.getElementById('btnConfirm');
        btn.disabled = true;
        btn.textContent = '저장 중...';

        var isUpdate = !!_editingTranscriptId;
        var fd = new FormData();
        fd.append('action', isUpdate ? 'transcriptUpdate' : 'transcriptSave');
        if (isUpdate) fd.append('transcriptId', _editingTranscriptId);
        fd.append('caseId', caseId);
        fd.append('stmtType', document.getElementById('selStmtType').value);
        fd.append('stmtName', document.getElementById('inputStmtName').value);
        fd.append('originalText', text);
        // 형광펜/메모 서식이 포함된 HTML도 함께 전송
        fd.append('originalHtml', getEditorHtml());

        // 전문부 날짜를 작성 시점 값 그대로 서버에 전송 → DB에 박아 고정
        // (수정 시에도 같이 보내지만, 잠금 상태라 값은 작성 당시 그대로임)
        var pY = (document.getElementById('pYear')  || {}).textContent || '';
        var pM = (document.getElementById('pMonth') || {}).textContent || '';
        var pD = (document.getElementById('pDay')   || {}).textContent || '';
        fd.append('preambleYear',  pY.trim());
        fd.append('preambleMonth', pM.trim());
        fd.append('preambleDay',   pD.trim());

        fetch('/caseApi', {method: 'POST', body: fd, credentials: 'same-origin'})
            .then(function(r) { return r.json(); })
            .then(function(d) {
                btn.disabled = false;
                resetConfirmBtn();
                if (d.success || d.transcriptId) {
                    showToast(isUpdate ? '조서가 수정되었습니다.' : '조서가 저장되었습니다.');
                    setTimeout(function() {
                        location.href = '/desktop/myCase?caseId=' + encodeURIComponent(caseId);
                    }, 1200);
                } else {
                    showToast(d.message || d.error || '저장 중 오류가 발생했습니다.');
                }
            }).catch(function() {
            btn.disabled = false;
            resetConfirmBtn();
            showToast('저장 중 오류가 발생했습니다.');
        });
    }

    function exportPdf() {
        var btn = document.getElementById('btnPdf');
        btn.disabled = true;
        btn.textContent = 'PDF 생성 중...';

        var form = document.querySelector('.jinsul-form');
        var editor = document.getElementById('editor');

        // 높이 제한 해제 (전체 내용 캡처)
        var prevFormH = form.style.height, prevFormOv = form.style.overflow, prevFormMx = form.style.maxHeight;
        var prevEdH = editor.style.height, prevEdOv = editor.style.overflow, prevEdMx = editor.style.maxHeight;
        form.style.setProperty('height', 'auto', 'important');
        form.style.setProperty('overflow', 'visible', 'important');
        form.style.setProperty('max-height', 'none', 'important');
        editor.style.setProperty('height', 'auto', 'important');
        editor.style.setProperty('overflow', 'visible', 'important');
        editor.style.setProperty('max-height', 'none', 'important');

        var caseId   = (document.getElementById('fieldCaseId').textContent || '').trim() || '조서';
        var stmtName = (document.getElementById('fieldName').textContent   || '').trim();
        var fileName = caseId + (stmtName ? '_' + stmtName : '') + '_진술조서.pdf';

        var A4_W = 210, A4_H = 297;

        function restoreStyles() {
            form.style.height = prevFormH; form.style.overflow = prevFormOv; form.style.maxHeight = prevFormMx;
            editor.style.height = prevEdH; editor.style.overflow = prevEdOv; editor.style.maxHeight = prevEdMx;
        }

        function resetBtn() {
            btn.disabled = false;
            btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg> PDF 저장';
        }

        setTimeout(function() {
            html2canvas(form, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff',
                logging: false,
                onclone: function(doc) {
                    var f = doc.querySelector('.jinsul-form');
                    var e = doc.getElementById('editor');
                    if (f) { f.style.height='auto'; f.style.overflow='visible'; f.style.maxHeight='none'; f.style.boxShadow='none'; f.style.borderRadius='0'; f.style.border='none'; }
                    if (e) { e.style.height='auto'; e.style.overflow='visible'; e.style.maxHeight='none'; e.style.whiteSpace='pre-wrap'; }
                    doc.querySelectorAll('.jf-blank').forEach(function(el){ el.style.color='#1a1a2e'; el.style.borderBottomColor='#1a1a2e'; });

                    // PDF에는 형광펜/메모 서식 제거 — 일반 텍스트만 보이도록
                    if (e) {
                        e.querySelectorAll('.hl-mark, .memo-mark').forEach(function(el) {
                            el.style.background = 'transparent';
                            el.style.backgroundColor = 'transparent';
                            el.style.borderBottom = 'none';
                            el.style.border = 'none';
                            el.style.color = '#1a1a2e';
                            el.style.boxShadow = 'none';
                            el.style.padding = '0';
                            el.style.borderRadius = '0';
                        });
                    }
                }
            }).then(function(canvas) {
                restoreStyles();
                var jsPDF = window.jspdf.jsPDF;
                var pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                var cW = canvas.width, cH = canvas.height;
                var pageH_px = Math.floor(cW * A4_H / A4_W);
                var totalPages = Math.ceil(cH / pageH_px);
                for (var i = 0; i < totalPages; i++) {
                    if (i > 0) pdf.addPage();
                    var srcY = i * pageH_px;
                    var srcH = Math.min(pageH_px, cH - srcY);
                    var pc = document.createElement('canvas');
                    pc.width = cW; pc.height = pageH_px;
                    var ctx = pc.getContext('2d');
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cW, pageH_px);
                    ctx.drawImage(canvas, 0, srcY, cW, srcH, 0, 0, cW, srcH);
                    pdf.addImage(pc.toDataURL('image/jpeg', 0.97), 'JPEG', 0, 0, A4_W, A4_H);
                }
                pdf.save(fileName);
                resetBtn();
                showToast('저장 완료: ' + fileName);
            }).catch(function(err) {
                restoreStyles(); resetBtn();
                showToast('PDF 생성 오류가 발생했습니다.');
                console.error(err);
            });
        }, 120);
    }

    function showToast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(function() { t.classList.remove('show'); }, 2500);
    }

    // 임시저장은 헤더의 '임시저장 목록' 버튼에서 수동으로 불러옴 (자동 confirm 제거)

    /* ──────────────────────────────────────────────────────────────
     * 서식 툴바: 굵게/기울기/밑줄/형광펜
     *  - 버튼 활성 상태(눌린 표시)는 selection 변경 시마다 갱신
     *  - 형광펜은 토글: 이미 형광펜이 칠해진 영역을 선택해 다시 누르면 해제
     *  - 모든 버튼은 onmousedown="event.preventDefault()"로 selection 보존
     * ────────────────────────────────────────────────────────────── */
    (function toolbarState() {
        // 형광펜 사용 가능 색 (이름:색)
        var HL_COLORS = [
            { name: '주황',   color: '#ffcc80' },
            { name: '분홍',   color: '#f8bbd0' },
            { name: '초록',   color: '#c5e1a5' },
            { name: '하늘',   color: '#b3e5fc' },
            { name: '보라',   color: '#d1c4e9' }
        ];
        var _savedHl = localStorage.getItem('hl_color_pref');
        var _validColors = HL_COLORS.map(function(c) { return c.color; });
        var _currentHlColor = (_savedHl && _validColors.indexOf(_savedHl) !== -1) ? _savedHl : HL_COLORS[0].color;
        var editor = document.getElementById('editor');

        // 본문 내의 마지막 selection range를 기억해두고 버튼 클릭 시 복원
        // (버튼 클릭 시점에는 onmousedown=preventDefault로 selection이 유지되지만,
        //  본문 바깥(전문부 빈칸 등)에 selection이 있을 때 서식 명령이 그쪽에 적용되는 걸 막기 위해
        //  본문 selection만 다루도록 강제)
        var _lastEditorRange = null;
        function rememberEditorSelection() {
            var s = window.getSelection();
            if (!s || s.rangeCount === 0) return;
            var r = s.getRangeAt(0);
            if (editor.contains(r.commonAncestorContainer)) {
                _lastEditorRange = r.cloneRange();
            }
        }
        editor.addEventListener('mouseup',  rememberEditorSelection);
        editor.addEventListener('keyup',    rememberEditorSelection);
        editor.addEventListener('focus',    rememberEditorSelection);

        // selection이 본문 안인지 확인. 아니면 기억해둔 본문 range를 복원해서 반환.
        // 본문 selection이 한 번도 없었으면 null 반환 → 명령 실행 안 함.
        function ensureEditorSelection() {
            var s = window.getSelection();
            if (s && s.rangeCount > 0) {
                var r = s.getRangeAt(0);
                if (editor.contains(r.commonAncestorContainer)) return r;
            }
            // 본문 바깥에 selection이 있거나 selection이 없음 → 기억해둔 본문 range 복원
            if (_lastEditorRange && editor.contains(_lastEditorRange.commonAncestorContainer)) {
                try {
                    var sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(_lastEditorRange);
                    editor.focus();
                    return _lastEditorRange;
                } catch (e) {}
            }
            return null;
        }

        // 공통 서식 명령 (bold/italic/underline)
        //  - 본문에 selection이 있거나 본문 selection 기억이 있을 때만 실행.
        //  - 본문을 한 번도 클릭한 적이 없으면 아무 일도 하지 않음.
        window.fmt = function(cmd) {
            var r = ensureEditorSelection();
            if (!r) { updateToolbarState(); return; }
            try { document.execCommand(cmd, false, null); } catch (e) {}
            updateToolbarState();
        };

        // 형광펜 토글
        //  - execCommand('hiliteColor')는 적용 상태가 입력 모드에 남아 그 다음 타이핑까지 칠해지는 문제가 있어
        //    DOM을 직접 조작하는 방식으로 처리.
        //  - 동작:
        //      1) 선택 영역이 이미 형광펜 안 → 해제 (앵커 span 풀기)
        //      2) 그 외 → 선택 영역을 <span class="hl-mark"> 로 감싸기 (class 기반이라 CSS로 색 제어)
        //  - 적용 후 selection을 끝으로 collapse → 사용자가 이어서 타이핑해도 형광펜이 따라붙지 않음
        window.toggleHighlight = function() {
            var range = ensureEditorSelection();
            if (!range) { updateToolbarState(); return; }
            // 최신 selection의 range로 다시 받음 (ensureEditorSelection이 복원한 경우 포함)
            var sel = window.getSelection();
            range = sel.getRangeAt(0);

            // 빈 선택(커서만 있는 경우): 커서가 형광펜 영역 안에 있으면 그 span을 해제, 아니면 무시
            if (range.collapsed) {
                var span = findHlSpan(range.startContainer);
                if (span) {
                    unwrapHlSpan(span);
                    // 커서 위치 보존: span이 있던 자리에 빈 커서
                    editor.focus();
                }
                updateToolbarState();
                return;
            }

            // 선택 영역 안에 형광펜이 하나라도 있으면 → 해제 모드
            // (영역에 걸친 모든 hl-mark span을 풀어버림)
            if (rangeIntersectsHl(range)) {
                removeHlInRange(range);
            } else {
                wrapRangeWithHl(range);
            }

            // 핵심: 선택을 끝점으로 collapse → 다음 타이핑은 형광펜 밖에서 시작
            // (브라우저가 selection 끝의 스타일을 이어받지 않게 함)
            collapseToEndOutsideHl();
            updateToolbarState();
        };

        // 노드에서 위로 올라가며 hl-mark span 찾기 (editor 경계까지)
        function findHlSpan(node) {
            if (!node) return null;
            if (node.nodeType === 3) node = node.parentNode;
            while (node && node !== editor) {
                if (node.nodeType === 1 && node.classList && node.classList.contains('hl-mark')) return node;
                node = node.parentNode;
            }
            return null;
        }

        // hl-mark span의 자식들을 부모로 풀어내고 자신은 제거
        function unwrapHlSpan(span) {
            var parent = span.parentNode;
            while (span.firstChild) parent.insertBefore(span.firstChild, span);
            parent.removeChild(span);
        }

        // 선택 영역과 교차하는 hl-mark span이 하나라도 있는지
        function rangeIntersectsHl(range) {
            var marks = editor.querySelectorAll('.hl-mark');
            for (var i = 0; i < marks.length; i++) {
                if (range.intersectsNode && range.intersectsNode(marks[i])) return true;
                // 폴백: 시작/끝 컨테이너가 그 안인지
                if (marks[i].contains(range.startContainer) || marks[i].contains(range.endContainer)) return true;
            }
            return false;
        }

        // 선택 영역에 걸친 hl-mark를 모두 해제 (영역 단위 정밀 해제까지는 안 하고 통째로 풀음)
        function removeHlInRange(range) {
            var marks = editor.querySelectorAll('.hl-mark');
            var hit = [];
            for (var i = 0; i < marks.length; i++) {
                var m = marks[i];
                var inside = (range.intersectsNode && range.intersectsNode(m))
                    || m.contains(range.startContainer) || m.contains(range.endContainer);
                if (inside) hit.push(m);
            }
            hit.forEach(unwrapHlSpan);
        }

        // 선택 영역을 hl-mark span으로 감싸기 (현재 _currentHlColor 사용)
        function wrapRangeWithHl(range) {
            var span = document.createElement('span');
            span.className = 'hl-mark';
            span.style.backgroundColor = _currentHlColor;
            try {
                // 가장 단순: extractContents → wrap → insert
                var frag = range.extractContents();
                span.appendChild(frag);
                range.insertNode(span);
            } catch (e) {
                // 복잡한 셀렉션(예: 부분 노드 걸침)에서 실패할 수 있음
                try { range.surroundContents(span); } catch (ee) {}
            }
            // 기준 텍스트 저장 (input 가드에서 늘어난 부분을 밖으로 빼낼 때 비교용)
            span.setAttribute('data-hl-locked-text', span.textContent);
        }

        // 선택을 hl-mark 바깥의 끝점으로 collapse → 이후 타이핑이 형광펜 밖으로 가게
        //  - 단순히 setStartAfter(hl)로 caret을 옮기면 일부 브라우저(Chrome 등)가 caret의
        //    스타일 컨텍스트를 직전 형제(hl-mark)에서 상속해, 새로 입력된 글자가 hl-mark 안으로
        //    들어가는 문제가 있음.
        //  - 해결: hl-mark 직후에 zero-width space 텍스트 노드(\u200B)를 삽입하고 그 안으로 caret을
        //    옮긴다. 그러면 새 글자가 그 텍스트 노드 안에 들어가 hl-mark 밖에서 시작됨.
        //  - ZWS는 저장(innerText) 시 sanitizeEditorText로 제거됨.
        function collapseToEndOutsideHl() {
            var sel = window.getSelection();
            if (!sel || sel.rangeCount === 0) return;
            var range = sel.getRangeAt(0);
            var endNode = range.endContainer;
            var hl = findHlSpan(endNode);
            var newRange = document.createRange();

            if (hl && hl.parentNode) {
                // hl-mark 바로 다음에 새 ZWS 텍스트 노드를 삽입
                // (이전 ZWS가 남아있어도 sanitizeEditorText로 저장 시 모두 정리됨)
                var zws = document.createTextNode('\u200B');
                hl.parentNode.insertBefore(zws, hl.nextSibling);
                // ZWS 텍스트 노드 끝(=ZWS 뒤)에 caret을 둠 → 입력 시 ZWS 뒤에 글자가 붙음
                newRange.setStart(zws, zws.nodeValue.length);
                newRange.collapse(true);
            } else {
                newRange.setStart(range.endContainer, range.endOffset);
                newRange.collapse(true);
            }
            sel.removeAllRanges();
            sel.addRange(newRange);
            editor.focus();
        }

        // 툴바 활성 상태 갱신
        function updateToolbarState() {
            // 현재 selection이 editor 안에 없으면 모든 버튼 비활성 표시 해제
            var sel = window.getSelection();
            var inEditor = false;
            if (sel && sel.rangeCount > 0) {
                var n = sel.getRangeAt(0).commonAncestorContainer;
                inEditor = editor.contains(n) || editor === n;
            }

            var setActive = function(cmd, on) {
                var btn = document.querySelector('.tb-btn[data-cmd="' + cmd + '"]');
                if (btn) btn.classList.toggle('active', !!on);
            };

            if (!inEditor) {
                setActive('bold', false);
                setActive('italic', false);
                setActive('underline', false);
                setActive('hilite', false);
                return;
            }

            try { setActive('bold',      document.queryCommandState('bold')); }      catch (e) {}
            try { setActive('italic',    document.queryCommandState('italic')); }    catch (e) {}
            try { setActive('underline', document.queryCommandState('underline')); } catch (e) {}
            // 형광펜 활성 표시: 커서가 hl-mark 안에 있을 때
            var anchorNode = sel.getRangeAt(0).startContainer;
            setActive('hilite', !!findHlSpan(anchorNode));
        }

        // selection 변경 추적: 가장 안정적인 방법은 document selectionchange
        document.addEventListener('selectionchange', updateToolbarState);
        // 키 입력 후에도 갱신
        editor.addEventListener('keyup', updateToolbarState);
        editor.addEventListener('mouseup', updateToolbarState);
        editor.addEventListener('focus', updateToolbarState);
        editor.addEventListener('blur', function() {
            // 포커스 잃었을 때 버튼은 그대로 두기보다 비우는 게 자연스러움
            setTimeout(updateToolbarState, 50);
        });

        /* ─── 형광펜 영역으로 입력이 흘러드는 것 방지 ─────────────────
         * 일부 브라우저(Chrome 등)는 caret이 형광펜 span 직후에 있어도
         * 직전 인라인 요소의 스타일 컨텍스트를 상속해 새 글자를 span 안에 넣음.
         * (ZWS 분리자도 케이스에 따라 통하지 않음)
         *
         * 해결: 형광펜 적용 시점의 텍스트를 data-hl-locked-text에 저장하고,
         * input 이벤트마다 각 hl-mark의 textContent가 그 기준의 끝에 글자가
         * 붙은 형태로 늘어났는지 검사. 늘어났다면 그 늘어난 부분(=새 입력)을
         * hl-mark 밖으로 끄집어내고 caret을 그 위치로 옮긴다.
         *
         * IME 친화: input 이벤트는 한글 조합이 끝난 후에 발생하므로 안전.
         * compositionend도 추가로 처리하여 한글 입력 직후에도 가드가 도는 것을 보장.
         */
        function evictTailFromHl(span, baseText) {
            // span의 마지막 텍스트 노드를 찾아 baseText 길이 이후의 글자를 잘라낸다.
            // span 안에 여러 노드가 있을 수 있으나, 일반적으로 입력은 마지막 텍스트 노드에 들어감.
            var current = span.textContent;
            if (current.length <= baseText.length) return null;
            if (current.indexOf(baseText) !== 0) return null; // prefix가 아니면 처리 안 함
            var addedText = current.substring(baseText.length);
            if (!addedText) return null;

            // span의 노드들을 뒤에서부터 훑으며 addedText 길이만큼 잘라냄
            var remaining = addedText.length;
            // 가장 단순한 처리: span의 마지막 텍스트 노드부터 잘라냄
            var lastTextNode = null;
            var walker = document.createTreeWalker(span, NodeFilter.SHOW_TEXT, null);
            var textNodes = [];
            while (walker.nextNode()) textNodes.push(walker.currentNode);
            if (textNodes.length === 0) return null;

            // 끝에서부터 remaining만큼 자르며 모음
            var addedFragment = document.createDocumentFragment();
            for (var i = textNodes.length - 1; i >= 0 && remaining > 0; i--) {
                var tn = textNodes[i];
                var v = tn.nodeValue || '';
                if (v.length >= remaining) {
                    var keep = v.substring(0, v.length - remaining);
                    var taken = v.substring(v.length - remaining);
                    tn.nodeValue = keep;
                    addedFragment.insertBefore(document.createTextNode(taken), addedFragment.firstChild);
                    remaining = 0;
                } else {
                    addedFragment.insertBefore(document.createTextNode(v), addedFragment.firstChild);
                    remaining -= v.length;
                    tn.parentNode.removeChild(tn);
                }
            }
            // 빈 텍스트 노드 정리
            // (정리는 자연스럽게 유지되어도 무방)

            // addedFragment를 span 다음 형제로 삽입
            var parent = span.parentNode;
            var inserted = addedFragment;
            // 이미 span 다음에 텍스트 노드가 있으면 그 앞에 합쳐 caret 위치를 명확히 함
            var refNode = span.nextSibling;
            if (refNode && refNode.nodeType === 3) {
                // 텍스트 노드 앞에 새 텍스트 합치고, refNode 자체에 prepend
                var newText = '';
                while (inserted.firstChild) {
                    if (inserted.firstChild.nodeType === 3) {
                        newText += inserted.firstChild.nodeValue;
                    }
                    inserted.removeChild(inserted.firstChild);
                }
                refNode.nodeValue = newText + refNode.nodeValue;
                // caret 위치: refNode의 newText 끝
                return { node: refNode, offset: newText.length };
            } else {
                // 그냥 span 다음에 fragment 삽입
                var firstAdded = inserted.firstChild;
                parent.insertBefore(inserted, refNode);
                // caret 위치: 새로 삽입된 마지막 텍스트 노드의 끝
                if (firstAdded && firstAdded.nodeType === 3) {
                    return { node: firstAdded, offset: firstAdded.nodeValue.length };
                }
            }
            return null;
        }

        var _hlGuardRunning = false;
        function guardHlInput() {
            if (_hlGuardRunning) return;
            _hlGuardRunning = true;
            try {
                var marks = editor.querySelectorAll('.hl-mark');
                var caretPos = null;

                // 1단계: 늘어난 hl-mark에서 추가 글자 끄집어내기
                for (var i = 0; i < marks.length; i++) {
                    var m = marks[i];
                    var base = m.getAttribute('data-hl-locked-text');
                    if (base == null) continue;
                    var pos = evictTailFromHl(m, base);
                    if (pos) caretPos = pos;
                }

                // 2단계: 빈(또는 ZWS만 남은) hl-mark 제거
                //  - 사용자가 형광펜 글자를 모두 지운 경우 빈 <span class="hl-mark"></span>이 남고,
                //    caret이 그 안에 있으면 새 글자가 형광펜 안에 들어가버림. 빈 span을 풀어야 함.
                //  - 제거 전 caret이 이 span 안에 있었으면 caret을 span 직전 위치로 옮김.
                var emptyMarks = editor.querySelectorAll('.hl-mark');
                for (var j = 0; j < emptyMarks.length; j++) {
                    var em = emptyMarks[j];
                    var txt = (em.textContent || '').replace(/\u200B/g, '');
                    if (txt.length === 0) {
                        // caret이 이 span 안인지 확인
                        var sel0 = window.getSelection();
                        var caretInside = false;
                        if (sel0 && sel0.rangeCount > 0) {
                            var rr = sel0.getRangeAt(0);
                            caretInside = em.contains(rr.startContainer) || em === rr.startContainer;
                        }
                        var parent = em.parentNode;
                        var nextRef = em.nextSibling;
                        parent.removeChild(em);
                        if (caretInside) {
                            // caret을 span이 있던 자리(부모 안)에 둠
                            try {
                                var sel1 = window.getSelection();
                                var rr1 = document.createRange();
                                if (nextRef) {
                                    rr1.setStartBefore(nextRef);
                                } else {
                                    // 부모 끝
                                    rr1.selectNodeContents(parent);
                                    rr1.collapse(false);
                                }
                                sel1.removeAllRanges();
                                sel1.addRange(rr1);
                                caretPos = null; // 이미 caret을 직접 옮겼으니 아래 처리 스킵
                            } catch (e) {}
                        }
                    }
                }

                if (caretPos) {
                    try {
                        var sel = window.getSelection();
                        var r = document.createRange();
                        r.setStart(caretPos.node, caretPos.offset);
                        r.collapse(true);
                        sel.removeAllRanges();
                        sel.addRange(r);
                    } catch (e) {}
                }
            } finally {
                _hlGuardRunning = false;
            }
        }
        editor.addEventListener('input', guardHlInput);
        editor.addEventListener('compositionend', guardHlInput);

        /* ─── 형광펜 색 팔레트 ─────────────────────────────────── */
        var hlPopover  = document.getElementById('hlPopover');
        var hlSwatches = document.getElementById('hlSwatches');
        var hlBar      = document.getElementById('hlBar');

        // 팔레트 swatch 렌더
        function renderSwatches() {
            hlSwatches.innerHTML = '';
            HL_COLORS.forEach(function(c) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'hl-swatch' + (c.color === _currentHlColor ? ' selected' : '');
                b.style.backgroundColor = c.color;
                b.title = c.name;
                b.setAttribute('aria-label', c.name);
                b.setAttribute('data-color', c.color);
                // 클릭 시 selection 보존
                b.addEventListener('mousedown', function(e) { e.preventDefault(); });
                b.addEventListener('click', function(e) {
                    e.stopPropagation();
                    chooseColor(c.color);
                });
                hlSwatches.appendChild(b);
            });
        }

        // 현재 형광펜 아이콘의 바 색 갱신
        function syncHlBar() {
            if (hlBar) hlBar.style.background = _currentHlColor;
        }

        // 색 선택: 현재 색 변경 + (선택 영역이 있으면) 그 영역에 즉시 적용
        function chooseColor(color) {
            _currentHlColor = color;
            try { localStorage.setItem('hl_color_pref', color); } catch (e) {}
            // swatch 선택 표시 갱신
            Array.prototype.forEach.call(hlSwatches.children, function(el) {
                el.classList.toggle('selected', el.getAttribute('data-color') === color);
            });
            syncHlBar();

            // 1) 본문에 선택 영역이 있으면: 적용 (또는 기존 형광펜 색만 변경)
            var sel = window.getSelection();
            var hasSelection = sel && sel.rangeCount > 0 && !sel.getRangeAt(0).collapsed
                && editor.contains(sel.getRangeAt(0).commonAncestorContainer);

            if (hasSelection) {
                var range = sel.getRangeAt(0);
                // 선택 영역에 이미 형광펜이 있으면 그 색만 바꾸고, 없으면 새로 칠함
                if (rangeIntersectsHl(range)) {
                    var marks = editor.querySelectorAll('.hl-mark');
                    Array.prototype.forEach.call(marks, function(m) {
                        var inside = (range.intersectsNode && range.intersectsNode(m))
                            || m.contains(range.startContainer) || m.contains(range.endContainer);
                        if (inside) m.style.backgroundColor = color;
                    });
                } else {
                    wrapRangeWithHl(range);
                }
                collapseToEndOutsideHl();
            }
            // 2) 선택 영역이 없으면: 다음 형광펜 적용 시 사용할 색만 바뀜
            closeHlPopover();
            updateToolbarState();
        }

        function openHlPopover(triggerEl) {
            hlPopover.classList.add('open');
            // 트리거(▾ 버튼) 기준으로 좌표 계산 — fixed라 viewport 좌표 사용
            if (triggerEl && triggerEl.getBoundingClientRect) {
                var r = triggerEl.getBoundingClientRect();
                // 일단 좌하단에 배치, viewBox 벗어나면 보정
                hlPopover.style.top  = (r.bottom + 4) + 'px';
                hlPopover.style.left = r.left + 'px';
                // 우측 잘림 보정
                var pw = hlPopover.offsetWidth || 180;
                if (r.left + pw > window.innerWidth - 8) {
                    hlPopover.style.left = Math.max(8, window.innerWidth - pw - 8) + 'px';
                }
            }
        }
        function closeHlPopover() { hlPopover.classList.remove('open'); }
        window.toggleHlPopover = function(e) {
            if (e) e.stopPropagation();
            if (hlPopover.classList.contains('open')) closeHlPopover();
            else openHlPopover(e && e.currentTarget);
        };

        // 바깥 클릭 시 팔레트 닫기
        document.addEventListener('click', function(e) {
            if (!hlPopover.classList.contains('open')) return;
            if (hlPopover.contains(e.target)) return;
            // 트리거 자체는 toggleHlPopover에서 처리하므로 그 외 클릭에만 닫음
            if (e.target.closest && e.target.closest('.hl-caret')) return;
            closeHlPopover();
        });
        // Esc로 닫기
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeHlPopover();
        });

        renderSwatches();
        syncHlBar();

        // 초기 1회
        updateToolbarState();
    })();

    /* ═══════════════════════════════════════════════════════════
       메모 기능
    ═══════════════════════════════════════════════════════════ */
    (function() {
        var _memoMode      = false;
        var _memoCounter   = 0;
        var _currentMemoId = null;
        var _pendingRange  = null;

        var editor    = document.getElementById('editor');
        var memoBtn   = document.getElementById('memoBtn');
        var backdrop  = document.getElementById('memoModalBackdrop');
        var textarea  = document.getElementById('memoTextarea');
        var selTextEl = document.getElementById('memoSelectedText');
        var deleteBtnEl = document.getElementById('memoBtnDelete');
        var tooltip   = document.getElementById('memoTooltip');

        window.toggleMemoMode = function() {
            // 현재 선택된 텍스트가 있는지 확인
            var sel = window.getSelection();
            var hasSelection = sel && sel.rangeCount > 0 && !sel.getRangeAt(0).collapsed
                && editor.contains(sel.getRangeAt(0).commonAncestorContainer);

            if (!hasSelection) {
                // 선택된 글이 없으면 활성화 안 함
                showToast('메모를 달 텍스트를 먼저 선택해주세요.');
                return;
            }

            // 선택된 텍스트가 있으면 바로 모달 열기 (모드 토글 없이)
            openNewMemoModal(sel.getRangeAt(0));
        };

        function openNewMemoModal(range) {
            _currentMemoId = null;
            _pendingRange  = range ? range.cloneRange() : null;
            selTextEl.textContent = _pendingRange ? _pendingRange.toString().trim() : '(선택된 텍스트 없음)';
            textarea.value = '';
            deleteBtnEl.style.display = 'none';
            backdrop.classList.add('open');
            setTimeout(function() { textarea.focus(); }, 80);
        }

        function openEditMemoModal(markEl) {
            _currentMemoId = markEl.getAttribute('data-memo-id');
            _pendingRange  = null;
            selTextEl.textContent = markEl.textContent.trim();
            textarea.value = markEl.getAttribute('data-memo-text') || '';
            deleteBtnEl.style.display = 'inline-flex';
            backdrop.classList.add('open');
            setTimeout(function() { textarea.focus(); }, 80);
        }

        window.closeMemoModal = function() {
            backdrop.classList.remove('open');
            _pendingRange  = null;
            _currentMemoId = null;
            _memoMode = false;
            memoBtn.classList.remove('active');
        };

        window.saveMemo = function() {
            var text = textarea.value.trim();
            if (!text) { showToast('메모 내용을 입력해주세요.'); return; }
            if (_currentMemoId) {
                var existing = editor.querySelector('[data-memo-id="' + _currentMemoId + '"]');
                if (existing) existing.setAttribute('data-memo-text', text);
            } else {
                if (_pendingRange && !_pendingRange.collapsed) {
                    var id = 'memo-' + (++_memoCounter);
                    wrapRangeWithMemo(_pendingRange, id, text);
                }
            }
            closeMemoModal();
            showToast('메모가 저장되었습니다.');
        };

        window.deleteMemo = function() {
            if (!_currentMemoId) return;
            var mark = editor.querySelector('[data-memo-id="' + _currentMemoId + '"]');
            if (mark) {
                var parent = mark.parentNode;
                while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
                parent.removeChild(mark);
                parent.normalize();
            }
            closeMemoModal();
            showToast('메모가 삭제되었습니다.');
        };

        function wrapRangeWithMemo(range, id, memoText) {
            var createdMark = null;
            try {
                var mark = document.createElement('span');
                mark.className = 'memo-mark';
                mark.setAttribute('data-memo-id', id);
                mark.setAttribute('data-memo-text', memoText);
                range.surroundContents(mark);
                attachMemoEvents(mark);
                createdMark = mark;
            } catch (e) {
                try {
                    var frag = range.extractContents();
                    var mark2 = document.createElement('span');
                    mark2.className = 'memo-mark';
                    mark2.setAttribute('data-memo-id', id);
                    mark2.setAttribute('data-memo-text', memoText);
                    mark2.appendChild(frag);
                    range.insertNode(mark2);
                    attachMemoEvents(mark2);
                    createdMark = mark2;
                } catch (e2) {}
            }
            if (createdMark) {
                // 메모 안 텍스트 길이를 잠가둠 (이후 가드에서 사용)
                createdMark.setAttribute('data-memo-locked-text', createdMark.textContent || '');
                // caret을 메모 마크 바로 뒤로 이동시켜 다음 입력이 메모 밖에서 시작되도록
                try {
                    var sel = window.getSelection();
                    var r = document.createRange();
                    r.setStartAfter(createdMark);
                    r.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(r);
                } catch (eMove) {}
            }
        }

        window._reattachMemoEvents = function(m) { attachMemoEvents(m); };
        function attachMemoEvents(markEl) {
            markEl.addEventListener('click', function(e) {
                e.stopPropagation();
                openEditMemoModal(markEl);
            });
            markEl.addEventListener('mouseenter', function(e) {
                var text = markEl.getAttribute('data-memo-text');
                if (!text) return;
                tooltip.textContent = text;
                tooltip.classList.add('show');
                positionTooltip(e);
            });
            markEl.addEventListener('mousemove', positionTooltip);
            markEl.addEventListener('mouseleave', function() {
                tooltip.classList.remove('show');
            });
        }

        function positionTooltip(e) {
            var tw = tooltip.offsetWidth || 200;
            var th = tooltip.offsetHeight || 36;
            var x = e.clientX + 12;
            var y = e.clientY - th - 8;
            if (x + tw > window.innerWidth - 8) x = window.innerWidth - tw - 8;
            if (y < 8) y = e.clientY + 20;
            tooltip.style.left = x + 'px';
            tooltip.style.top  = y + 'px';
        }

        backdrop.addEventListener('click', function(e) {
            if (e.target === backdrop) closeMemoModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && backdrop.classList.contains('open')) closeMemoModal();
        });

        textarea.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                saveMemo();
            }
        });

        Array.prototype.forEach.call(editor.querySelectorAll('.memo-mark'), function(m) {
            attachMemoEvents(m);
            if (!m.hasAttribute('data-memo-locked-text')) {
                m.setAttribute('data-memo-locked-text', m.textContent || '');
            }
        });

        /* ── 메모 가드: 메모 마크 끝에 글자가 추가되면 마크 밖으로 빼냄 ── */
        var _memoGuardRunning = false;
        function guardMemoInput() {
            if (_memoGuardRunning) return;
            _memoGuardRunning = true;
            try {
                var marks = editor.querySelectorAll('.memo-mark');
                var caretPos = null;

                // 1) 늘어난 memo-mark에서 추가 글자 끄집어내기
                for (var i = 0; i < marks.length; i++) {
                    var m = marks[i];
                    var base = m.getAttribute('data-memo-locked-text');
                    if (base == null) continue;
                    var cur = m.textContent || '';
                    if (cur.length <= base.length) continue;

                    // 끝에 추가된 부분만 분리
                    var extra = cur.substring(base.length);
                    // memo 안 마지막 텍스트노드에서 추가된 글자 길이만큼 잘라냄
                    var last = m.lastChild;
                    while (last && last.nodeType !== 3 && last.lastChild) last = last.lastChild;
                    if (last && last.nodeType === 3) {
                        var ln = last.nodeValue || '';
                        // 끝에서 extra 길이만큼 잘라냄
                        if (ln.length >= extra.length) {
                            last.nodeValue = ln.substring(0, ln.length - extra.length);
                        }
                    }
                    // memo-mark 다음 형제 위치에 텍스트 노드 삽입(또는 기존 텍스트 노드에 prepend)
                    var parent = m.parentNode;
                    var next = m.nextSibling;
                    var inserted;
                    if (next && next.nodeType === 3) {
                        next.nodeValue = extra + (next.nodeValue || '');
                        inserted = next;
                        caretPos = { node: inserted, offset: extra.length };
                    } else {
                        inserted = document.createTextNode(extra);
                        parent.insertBefore(inserted, next);
                        caretPos = { node: inserted, offset: extra.length };
                    }
                }

                // 2) 빈 memo-mark 제거
                var emptyMarks = editor.querySelectorAll('.memo-mark');
                for (var j = 0; j < emptyMarks.length; j++) {
                    var em = emptyMarks[j];
                    var txt = (em.textContent || '');
                    if (txt.length === 0) {
                        var pn = em.parentNode;
                        var nr = em.nextSibling;
                        var sel0 = window.getSelection();
                        var caretInside = false;
                        if (sel0 && sel0.rangeCount > 0) {
                            var rr = sel0.getRangeAt(0);
                            caretInside = em.contains(rr.startContainer) || em === rr.startContainer;
                        }
                        pn.removeChild(em);
                        if (caretInside) {
                            try {
                                var sel1 = window.getSelection();
                                var rr1 = document.createRange();
                                if (nr) rr1.setStartBefore(nr);
                                else { rr1.selectNodeContents(pn); rr1.collapse(false); }
                                sel1.removeAllRanges();
                                sel1.addRange(rr1);
                                caretPos = null;
                            } catch (eMR) {}
                        }
                    }
                }

                if (caretPos) {
                    try {
                        var sel = window.getSelection();
                        var r = document.createRange();
                        r.setStart(caretPos.node, caretPos.offset);
                        r.collapse(true);
                        sel.removeAllRanges();
                        sel.addRange(r);
                    } catch (eC) {}
                }
            } finally {
                _memoGuardRunning = false;
            }
        }
        editor.addEventListener('input', guardMemoInput);
        editor.addEventListener('compositionend', guardMemoInput);
    })();
</script>
