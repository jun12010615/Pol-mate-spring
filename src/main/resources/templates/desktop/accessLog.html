<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POL-MATE | 접근 로그</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Noto Sans KR', sans-serif; background: #f4f6fb; color: #1a1a2e; -webkit-font-smoothing: antialiased; }

.pm-page { padding: 28px 32px 48px; }

.page-header { margin-bottom: 22px; }
.page-title { font-size: 20px; font-weight: 700; color: #1a1a2e; }
.page-desc  { font-size: 13px; color: #6b7280; margin-top: 4px; }

.stat-row { display: flex; gap: 14px; margin-bottom: 22px; }
.stat-card {
    background: #fff; border: 1px solid #e2e5ee; border-radius: 14px;
    padding: 16px 22px; display: flex; align-items: center; gap: 14px; min-width: 180px;
}
.stat-icon {
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.stat-icon.blue  { background: #eff6ff; color: #1e40af; }
.stat-icon.green { background: #f0fdf4; color: #16a34a; }
.stat-label { font-size: 11px; color: #9ca3af; margin-bottom: 3px; }
.stat-value { font-size: 22px; font-weight: 700; color: #1a1a2e; font-family: 'Space Grotesk', sans-serif; }

.filter-bar {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
    background: #fff; border: 1px solid #e2e5ee; border-radius: 14px; padding: 14px 18px;
    flex-wrap: wrap;
}
.filter-label { font-size: 11px; color: #9ca3af; font-weight: 500; }
.filter-select, .filter-date {
    border: 1px solid #e2e5ee; border-radius: 8px; padding: 7px 12px;
    font-size: 12px; font-family: 'Noto Sans KR', sans-serif; color: #1a1a2e;
    background: #f9fafb; outline: none; transition: border-color 0.13s;
}
.filter-select:focus, .filter-date:focus { border-color: #0d1a33; background: #fff; }
.filter-sep { color: #e2e5ee; font-size: 13px; }
.btn-search {
    background: #0d1a33; color: #fff; border: none; border-radius: 8px;
    padding: 8px 18px; font-size: 12px; font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500; cursor: pointer; transition: background 0.13s; margin-left: auto;
}
.btn-search:hover { background: #1a2744; }

.log-table { background: #fff; border: 1px solid #e2e5ee; border-radius: 16px; overflow: hidden; }
.log-head {
    display: grid;
    grid-template-columns: 100px 80px 120px 1fr 130px 155px;
    padding: 10px 18px; border-bottom: 1px solid #e2e5ee; background: #f9fafb;
}
.th { font-size: 10px; font-weight: 500; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.6px; display: flex; align-items: center; }
.log-row {
    display: grid;
    grid-template-columns: 100px 80px 120px 1fr 130px 155px;
    padding: 11px 18px; border-bottom: 1px solid #f0f2f8; align-items: center;
    transition: background 0.1s;
}
.log-row:last-child { border-bottom: none; }
.log-row:hover { background: #f9fafb; }
.cell { font-size: 12px; color: #374151; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell-name { font-size: 13px; font-weight: 500; color: #1a1a2e; }
.type-badge {
    display: inline-flex; align-items: center; font-size: 10px; font-weight: 500;
    padding: 3px 9px; border-radius: 20px;
}
.t-case       { background: #eff6ff; color: #1e40af; }
.t-transcript { background: #f0fdf4; color: #16a34a; }
.t-board      { background: #fffbeb; color: #92400e; }
.cell-ip { font-family: 'Space Grotesk', sans-serif; font-size: 11px; color: #6b7280; }
.cell-time { font-size: 11px; color: #9ca3af; }
.empty-state { padding: 60px 20px; text-align: center; color: #9ca3af; font-size: 13px; }
.load-more {
    padding: 14px; text-align: center; font-size: 12px; color: #0d1a33;
    font-weight: 500; cursor: pointer; border-top: 1px solid #f0f2f8;
    transition: background 0.1s;
}
.load-more:hover { background: #f4f6fb; }
</style>
</head>
<body>
<div class="pm-layout" th:with="currentPage='accessLog'">
    <div th:replace="~{desktop/fragments/sidebar :: sidebar(${currentPage})}"></div>
    <div class="pm-content">
        <div th:replace="~{desktop/fragments/appbar :: appbar('POL-MATE,접근 로그')}"></div>
        <main class="pm-page">

            <div class="page-header">
                <div class="page-title">접근 로그</div>
                <div class="page-desc">부서 내 수사관의 사건·조서·게시글 열람 이력을 조회합니다.</div>
            </div>

            <div class="stat-row">
                <div class="stat-card">
                    <div class="stat-icon blue">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                    </div>
                    <div>
                        <div class="stat-label">오늘 열람 수</div>
                        <div class="stat-value" id="statToday">-</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                        </svg>
                    </div>
                    <div>
                        <div class="stat-label">최근 7일 열람 수</div>
                        <div class="stat-value" id="statWeek">-</div>
                    </div>
                </div>
            </div>

            <div class="filter-bar">
                <span class="filter-label">유형</span>
                <select id="filterType" class="filter-select">
                    <option value="">전체</option>
                    <option value="CASE_VIEW">사건 열람</option>
                    <option value="TRANSCRIPT_VIEW">조서 열람</option>
                    <option value="BOARD_VIEW">게시글 열람</option>
                </select>
                <span class="filter-sep">|</span>
                <span class="filter-label">기간</span>
                <input type="date" id="filterFrom" class="filter-date">
                <span style="font-size:12px;color:#9ca3af;">~</span>
                <input type="date" id="filterTo" class="filter-date">
                <button class="btn-search" onclick="loadLogs(true)">조회</button>
            </div>

            <div class="log-table">
                <div class="log-head">
                    <div class="th">수사관</div>
                    <div class="th">유형</div>
                    <div class="th">대상 ID</div>
                    <div class="th">대상명</div>
                    <div class="th">IP 주소</div>
                    <div class="th">열람 시각</div>
                </div>
                <div id="logBody"></div>
            </div>

        </main>
    </div>
</div>

<script>
var _page = 0;
var _size = 50;
var _loading = false;

var TYPE_LABELS = {
    'CASE_VIEW':       { label: '사건 열람',   cls: 't-case'       },
    'TRANSCRIPT_VIEW': { label: '조서 열람',   cls: 't-transcript' },
    'BOARD_VIEW':      { label: '게시글 열람', cls: 't-board'      }
};

function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function loadStats() {
    fetch('/accessLogApi?action=stats', {credentials:'same-origin'})
        .then(function(r){return r.json();})
        .then(function(d){
            document.getElementById('statToday').textContent = (d.today||0).toLocaleString();
            document.getElementById('statWeek').textContent  = (d.week||0).toLocaleString();
        }).catch(function(){});
}

function buildQuery(page) {
    var type = document.getElementById('filterType').value;
    var from = document.getElementById('filterFrom').value;
    var to   = document.getElementById('filterTo').value;
    var q = '/accessLogApi?action=list&page=' + page + '&size=' + _size;
    if (type) q += '&type=' + encodeURIComponent(type);
    if (from) q += '&from=' + encodeURIComponent(from);
    if (to)   q += '&to='   + encodeURIComponent(to);
    return q;
}

function loadLogs(reset) {
    if (_loading) return;
    if (reset) { _page = 0; document.getElementById('logBody').innerHTML = ''; }
    _loading = true;

    fetch(buildQuery(_page), {credentials:'same-origin'})
        .then(function(r){return r.json();})
        .then(function(data){
            _loading = false;
            if (!Array.isArray(data)) { renderEmpty(); return; }
            if (data.length === 0 && _page === 0) { renderEmpty(); return; }

            var body = document.getElementById('logBody');
            var moreEl = document.getElementById('logLoadMore');
            if (moreEl) moreEl.remove();

            data.forEach(function(r) {
                var typeInfo = TYPE_LABELS[r.targetType] || {label: r.targetType, cls: 't-case'};
                var row = document.createElement('div');
                row.className = 'log-row';
                row.innerHTML =
                    '<div class="cell cell-name">' + esc(r.userName || r.userId) + '</div>' +
                    '<div class="cell"><span class="type-badge ' + typeInfo.cls + '">' + esc(typeInfo.label) + '</span></div>' +
                    '<div class="cell" style="font-family:\'Space Grotesk\',sans-serif;font-size:11px;color:#6b7280;">' + esc(r.targetId) + '</div>' +
                    '<div class="cell">' + esc(r.targetName || '-') + '</div>' +
                    '<div class="cell cell-ip">' + esc(r.ip || '-') + '</div>' +
                    '<div class="cell cell-time">' + esc(r.accessedAt) + '</div>';
                body.appendChild(row);
            });

            if (data.length === _size) {
                var more = document.createElement('div');
                more.id = 'logLoadMore';
                more.className = 'load-more';
                more.textContent = '더 보기';
                more.onclick = function() { _page++; loadLogs(false); };
                body.appendChild(more);
            }
        })
        .catch(function(){ _loading = false; });
}

function renderEmpty() {
    document.getElementById('logBody').innerHTML =
        '<div class="empty-state">조회된 로그가 없습니다.</div>';
}

(function() {
    var today = new Date().toISOString().slice(0,10);
    var weekAgo = new Date(Date.now() - 7*24*60*60*1000).toISOString().slice(0,10);
    document.getElementById('filterFrom').value = weekAgo;
    document.getElementById('filterTo').value   = today;
    loadStats();
    loadLogs(true);
})();
</script>
</body>
</html>
